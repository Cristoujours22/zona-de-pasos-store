# Repository-owned Supabase configuration.
# Keep this file intentionally minimal so `supabase config push` cannot overwrite
# hosted settings that this application does not manage.
project_id = "zona-de-pasos-store"

[auth]
# Canonical production origin for authentication emails and approved redirects.
site_url = "https://zona-de-pasos-store.vercel.app"
additional_redirect_urls = ["https://zona-de-pasos-store.vercel.app/auth/invite"]
# Setup and invitation flows provision administrators through server-side admin APIs.
enable_signup = false

[auth.email]
# Keep password login enabled for provisioned administrators. Global signup remains disabled.
enable_signup = true
